<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Review agent runs | By Berit Alasmäki</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!--
      A theme the viewer chose (components/ThemeToggle.tsx) is applied before the first paint,
      so the page never flashes the other theme. No choice: the system setting decides.
    -->
    <script>
      try {
        var theme = localStorage.getItem('ledger:theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
    <!--
      Raleway (headings, buttons, wordmark) and Montserrat (body, table/data text) —
      see --font-heading / --font-body in src/styles/tokens.css. Only the weights
      actually used are requested.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700&family=Montserrat:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
